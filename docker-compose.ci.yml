version: '3.8'
services:
  web:
    image: sashcheka/user-management-service-repository:tagname
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && pytest"
    depends_on:
      - db
      - rabbitmq
      - redis
      - localstack
    env_file:
      - .env

  db:
    image: postgres:alpine

  redis:
    image: redis:alpine

  rabbitmq:
    image: rabbitmq:3-management-alpine

  localstack:
    image: localstack/localstack
