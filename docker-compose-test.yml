version: '3.8'
services:
  web-test:
    build:
      context: .
      dockerfile: src/Dockerfile
    command: sh -c "alembic upgrade head && python src/main.py"
    ports:
      - "8001:8000"
    volumes:
      - .:/src
    depends_on:
      db-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      localstack-test:
        condition: service_healthy
    env_file:
      - test.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck/", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db-test:
    image: postgres:alpine
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    env_file:
      - test.env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis-test:
    image: redis:alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data_test:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  localstack-test:
    image: localstack/localstack
    ports:
      - "4567:4566"
    volumes:
      - localstack_data_test:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data_test:
  rabbitmq_data_test:
  localstack_data_test:
