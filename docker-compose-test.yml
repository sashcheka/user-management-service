version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: src/Dockerfile
    command: sh -c "alembic upgrade head && python src/main.py"
    ports:
      - "8001:8001"
    volumes:
      - .:/src
    depends_on:
      - db-test
      - rabbitmq-test
      - redis-test
      - localstack-test
    env_file:
      - test.env

  db-test:
    image: postgres:alpine
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: test_demo_db
      POSTGRES_USER: test_postgres
      POSTGRES_PASSWORD: test_postgres
    ports:
      - "5433:5433"

  redis-test:
    image: redis:alpine
    ports:
      - "6380:6380"

  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5673"
      - "15673:15673"
    volumes:
      - rabbitmq_data_test:/var/lib/rabbitmq

  localstack-test:
    image: localstack/localstack
    ports:
      - "4567:4567"
    volumes:
      - localstack_data_test:/var/lib/localstack

volumes:
  postgres_data_test:
  rabbitmq_data_test:
  localstack_data_test:
