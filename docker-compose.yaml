services:
  web:
    build: .
    command: sh -c "alembic upgrade head && python main.py"
    ports:
      - 8000:8000
    volumes:
      - .:/app

  db:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:latest
    ports:
      - 6379:6379

volumes:
  postgres_data:
